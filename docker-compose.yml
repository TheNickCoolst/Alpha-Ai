version: '3.8'

services:
  # Alpha AI Main Service (GPU)
  alpha-ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: gpu-base
    container_name: alpha-ai
    hostname: alpha-ai
    ports:
      - "8000:8000"  # Web interface (future)
    volumes:
      # Configuration (persistent)
      - ./character_config.yaml:/app/character_config.yaml:ro
      # Conversation history (persistent)
      - ./chat_history.json:/app/chat_history.json
      # Voice samples (persistent)
      - ./character_files:/app/character_files:ro
      # Temporary audio files
      - ./audio:/app/audio
      # Logs
      - ./logs:/app/logs
    environment:
      # Groq Configuration
      - GROQ_API_KEY=${GROQ_API_KEY}
      # GPU Configuration
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
      # Python Configuration
      - PYTHONUNBUFFERED=1
    depends_on:
      - gpt-sovits
    restart: unless-stopped
    # GPU Support (requires nvidia-docker)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - alpha-ai-network

  # GPT-SoVITS TTS Server
  # Note: Replace with actual GPT-SoVITS image when available
  gpt-sovits:
    image: breakstring/gpt-sovits:latest
    container_name: gpt-sovits-server
    hostname: gpt-sovits
    ports:
      - "9880:9880"
    volumes:
      - ./sovits_models:/app/models
      - ./character_files:/app/references:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - alpha-ai-network
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9880/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Ollama for Local LLMs
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    hostname: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - alpha-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama-data:
    driver: local

networks:
  alpha-ai-network:
    driver: bridge
