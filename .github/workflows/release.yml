name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          release_name: Alpha AI ${{ steps.get_version.outputs.tag }}
          body: |
            # Alpha AI Release ${{ steps.get_version.outputs.tag }}

            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### Docker (Recommended)
            ```bash
            git clone https://github.com/TheNickCoolst/Alpha-Ai
            cd Alpha-Ai
            git checkout ${{ steps.get_version.outputs.tag }}
            ./docker-run.sh
            ```

            ### Manual Installation
            ```bash
            git clone https://github.com/TheNickCoolst/Alpha-Ai
            cd Alpha-Ai
            git checkout ${{ steps.get_version.outputs.tag }}
            ./install_alpha_ai.sh  # Linux/Mac
            # OR
            .\install_alpha_ai.ps1  # Windows
            ```

            ## Requirements
            - Python 3.10+
            - FFmpeg
            - OpenAI API Key
            - GPT-SoVITS server running on port 9880
            - Optional: NVIDIA GPU for acceleration

            For full documentation, see [README.md](https://github.com/TheNickCoolst/Alpha-Ai/blob/main/README.md)
          draft: false
          prerelease: false

  publish-docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: gpu-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: cpu-base
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-cpu
            ghcr.io/${{ github.repository }}:latest-cpu
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
