name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # Code Quality Checks
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install black flake8 isort mypy

      - name: Run Black (code formatting check)
        run: |
          black --check --line-length 100 server/
        continue-on-error: true

      - name: Run isort (import sorting check)
        run: |
          isort --check-only --profile black server/
        continue-on-error: true

      - name: Run Flake8 (linting)
        run: |
          flake8 server/ --max-line-length=100 --ignore=E203,W503,E501
        continue-on-error: true

      - name: Run MyPy (type checking)
        run: |
          mypy server/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (security linter)
        run: |
          bandit -r server/ -f json -o bandit-report.json || true
          bandit -r server/ || true
        continue-on-error: true

      - name: Run Safety (dependency vulnerability check)
        run: |
          pip install -r requirements-alpha-ai.txt
          safety check --json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json

  # Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg portaudio19-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-alpha-ai.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run tests
        run: |
          # Create basic test structure if tests don't exist
          mkdir -p tests
          if [ ! -f "tests/test_basic.py" ]; then
            cat > tests/test_basic.py << 'EOF'
          import sys
          import os
          sys.path.insert(0, os.path.join(os.path.dirname(__file__), '..', 'server'))

          def test_imports():
              """Test that core modules can be imported"""
              try:
                  import yaml
                  import sounddevice
                  import soundfile
                  from faster_whisper import WhisperModel
                  assert True
              except ImportError as e:
                  assert False, f"Import failed: {e}"

          def test_config_example_exists():
              """Test that config example exists"""
              assert os.path.exists('character_config.yaml.example')
          EOF
          fi

          pytest tests/ -v || echo "Tests need to be implemented"

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: cpu-base
          push: false
          tags: alpha-ai:test-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm alpha-ai:test-cpu python --version

  # Configuration Validation
  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Validate YAML files
        run: |
          python -c "
          import yaml
          import sys

          # Validate character_config.yaml.example
          try:
              with open('character_config.yaml.example', 'r') as f:
                  config = yaml.safe_load(f)
              print('✓ character_config.yaml.example is valid')

              # Check required keys
              required_keys = ['OPENAI_API_KEY', 'model', 'history_file', 'presets']
              for key in required_keys:
                  if key not in config:
                      print(f'❌ Missing required key: {key}')
                      sys.exit(1)

              print('✓ All required keys present')
          except Exception as e:
              print(f'❌ Validation failed: {e}')
              sys.exit(1)
          "

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.cpu.yml config > /dev/null
          echo "✓ Docker Compose files are valid"

  # Documentation Check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          echo "✓ README.md exists"

      - name: Check for TODO markers
        run: |
          # Find TODO comments in code
          TODO_COUNT=$(grep -r "TODO\|FIXME\|XXX" server/ --exclude-dir=__pycache__ | wc -l || true)
          echo "Found $TODO_COUNT TODO markers in code"

      - name: Validate installation scripts
        run: |
          # Check that installation scripts are executable
          if [ -f "install_alpha_ai.sh" ]; then
            test -x install_alpha_ai.sh || chmod +x install_alpha_ai.sh
            echo "✓ install_alpha_ai.sh is executable"
          fi

          if [ -f "docker-run.sh" ]; then
            test -x docker-run.sh || chmod +x docker-run.sh
            echo "✓ docker-run.sh is executable"
          fi
